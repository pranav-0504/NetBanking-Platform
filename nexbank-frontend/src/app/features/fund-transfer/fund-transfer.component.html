<main class="bank-page">
  <header class="bank-page__header">
    <div>
      <p>Payments</p>
      <h1>Funds Transfer</h1>
    </div>
    <a mat-stroked-button routerLink="/dashboard">
      <mat-icon>arrow_back</mat-icon>
      Dashboard
    </a>
  </header>

  <section class="transfer-layout">
    <mat-card class="transfer-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>send</mat-icon>
        <mat-card-title>Transfer Money</mat-card-title>
        <mat-card-subtitle>Choose IMPS for instant transfer or NEFT for 5 minutes</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="transferForm" class="transfer-form">
          <div class="mode-grid">
            <label [class.active]="transferForm.value.mode === 'IMPS'">
              <input type="radio" value="IMPS" formControlName="mode">
              <strong>IMPS</strong>
              <span>Instant</span>
            </label>

            <label [class.active]="transferForm.value.mode === 'NEFT'">
              <input type="radio" value="NEFT" formControlName="mode">
              <strong>NEFT</strong>
              <span>5 minutes</span>
            </label>
          </div>

          <div class="form-grid">
            <label>
              Beneficiary account number
              <input type="text" maxlength="8" formControlName="accountNumber" placeholder="12345678">
            </label>

            <label>
              IFSC code
              <input type="text" maxlength="9" formControlName="ifscCode" placeholder="NEX001234">
            </label>

            <label>
              Amount
              <input type="number" formControlName="amount" placeholder="1000">
            </label>

            <label>
              Note
              <input type="text" formControlName="note" placeholder="Optional">
            </label>
          </div>

          <button mat-flat-button color="primary" type="button" (click)="submitTransfer()" [disabled]="loading">
            <mat-icon>send</mat-icon>
            {{ loading ? 'Processing...' : 'Transfer Funds' }}
          </button>
        </form>
      </mat-card-content>
    </mat-card>

    <aside class="transfer-summary">
      <mat-icon>shield</mat-icon>
      <h2>Secure transfer rules</h2>
      <p>IMPS will process immediately. NEFT will be queued and marked complete after 5 minutes once backend transfer APIs are connected.</p>
    </aside>
  </section>
</main>
